[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadguard"
version = "0.2.0"
description = "Cognitive-Load-Aware AI Co-Worker for the IBM AI Builders Challenge (Wildcard: Future of Work)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27"]
llm = ["langchain>=0.2", "langchain-ibm>=0.1", "langgraph>=0.2"]
bob = ["mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
