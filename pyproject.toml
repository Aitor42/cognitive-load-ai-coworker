[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadguard"
version = "0.2.0"
description = "Cognitive-Load-Aware AI Co-Worker for the IBM AI Builders Challenge (Wildcard: Future of Work)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27"]
llm = ["langchain>=0.2", "langchain-ibm>=0.1", "langgraph>=0.2"]
bob = ["mcp>=1.0"]
dev = ["coverage>=7.4", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "langgraph",
    "langgraph.*",
    "langchain_ibm",
]
ignore_missing_imports = true
