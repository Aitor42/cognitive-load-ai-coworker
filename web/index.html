<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LoadGuard — Live Dashboard</title>
<style>
:root{color-scheme:dark}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e5e7eb;margin:0;padding:32px}
.wrap{max-width:960px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px}
.sub{color:#9ca3af;margin-bottom:16px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;margin-right:8px}
button:hover{background:#1d4ed8}
button.ghost{background:#1f2937;color:#e5e7eb}
button.ghost:hover{background:#374151}
button.green{background:#059669}
button.green:hover{background:#047857}
button.red{background:#b91c1c}
button.red:hover{background:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}
select{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:10px;font-size:14px;margin-right:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}
.card h2{margin:0 0 12px;font-size:16px;color:#d1d5db}
.big{font-size:44px;font-weight:700}
.bar{background:#1f2937;border-radius:8px;height:14px;overflow:hidden;margin:8px 0;position:relative}
.barmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#93c5fd;z-index:2}
.barmarklabel{position:absolute;top:-22px;font-size:10px;color:#93c5fd;transform:translateX(-50%);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid #1f2937}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.top td{color:#fbbf24;font-weight:600}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 0;border-bottom:1px solid #1f2937;display:flex;gap:8px;align-items:flex-start}
li:last-child{border-bottom:0}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;text-transform:uppercase;margin-right:8px;background:#374151;color:#e5e7eb;flex-shrink:0}
.badge.do{background:#065f46}.badge.delegate{background:#7c2d12}
.badge.focus_block{background:#1e3a8a}.badge.break{background:#4c1d95}.badge.batch{background:#0e7490}
.badge.reassign{background:#b45309}.badge.available{background:#065f46}.badge.absent{background:#7c2d12}
.itembody{flex:1}
.why{color:#9ca3af;font-size:13px;margin-top:2px}
.level{text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.delta{font-size:14px;color:#34d399}
.trend{font-size:13px;color:#93c5fd;margin-top:8px;line-height:1.5}
.note{font-size:15px;line-height:1.5}
.meta{font-size:12px;color:#9ca3af;margin-bottom:4px;line-height:1.7}
.summaryline{font-size:14px;color:#e5e7eb;margin:10px 0 0}
.summaryline b{color:#fbbf24}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;margin:2px 6px 2px 0;background:#1f2937;border:1px solid #374151}
.chip.granite{border-color:#2563eb;color:#93c5fd}
.chip.det{border-color:#6b7280;color:#d1d5db}
.chip.ok{border-color:#059669;color:#34d399}
.chip.warn{border-color:#b45309;color:#fbbf24}
.disc{color:#6b7280;font-size:12px;margin-top:20px}
.err{color:#f87171;margin-top:16px}
.actions{margin-top:14px}
.exportlinks a{color:#93c5fd;text-decoration:none;margin-right:12px;font-size:14px}
.exportlinks a:hover{text-decoration:underline}
.timeline{background:#0f172a;border-radius:8px;height:46px;position:relative;overflow:hidden;border:1px solid #1f2937}
.tlbar{position:absolute;border-radius:2px}
.tlbar.notification,.tlbar.context_switch{width:3px;top:16px;bottom:16px}
.tlbar.meeting{top:6px;bottom:6px}
.tlbar.focus_block{top:10px;bottom:10px}
.tlbar.notification{background:#fbbf24}
.tlbar.context_switch{background:#fb923c}
.tlbar.meeting{background:#f87171}
.tlbar.focus_block{background:#34d399}
.tllegend{display:flex;gap:14px;font-size:12px;color:#9ca3af;margin-top:6px;flex-wrap:wrap}
.tllegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lm::before{background:#f87171}.ln::before{background:#fbbf24}.lc::before{background:#fb923c}.lf::before{background:#34d399}
.feedback{margin-top:10px}
.privacy{font-size:13px;line-height:1.7}
.privacy b{color:#d1d5db}
.hidden{display:none}
details.section{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px 20px;margin-top:20px}
details.section summary{cursor:pointer;font-size:15px;color:#d1d5db;font-weight:600}
details.section[open] summary{margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>🧠 LoadGuard — Live Dashboard</h1>
<div class="sub">The AI co-worker whose job is to protect you from the other AI co-workers · IBM AI Builders Challenge 2026</div>

<div class="toolbar">
  <select id="scenario" onchange="run()">
    <option value="overload">Scenario: overload morning</option>
    <option value="balanced">Scenario: balanced day</option>
    <option value="calm">Scenario: calm day</option>
  </select>
  <select id="role" onchange="run()">
    <option value="">Role: Default profile</option>
    <option value="developer">Role: Developer (Focus-Heavy)</option>
    <option value="manager">Role: Manager (Meeting-Dense)</option>
    <option value="researcher">Role: Researcher (Deep Work)</option>
    <option value="support">Role: Support (Interruption-Dense)</option>
  </select>
  <button onclick="run()" id="runBtn">Run analysis</button>
  <input type="file" id="fileInput" accept=".ics,.jsonl" style="display:none" onchange="handleFileUpload(event)">
  <button class="ghost" onclick="document.getElementById('fileInput').click()">📁 Upload my signals (.ics / .jsonl)</button>
  <button class="ghost" onclick="middayReview()" id="middayBtn" disabled>Midday re-organization</button>
  <button class="ghost" onclick="saveToBaseline()" id="saveBaseline" disabled>Save today's score to baseline</button>
  <button class="ghost" onclick="loadHistory()">Show baseline history</button>
</div>
<div id="historyBox" class="meta hidden" style="background:#111827;border:1px solid #1f2937;border-radius:8px;padding:12px;margin:12px 0"></div>
<div class="meta" id="modelChips"></div>
<div class="err" id="err"></div>
<div id="out"></div>
<div id="middayBox"></div>
</div>

<script>
const LABELS={context_switches_per_hour:"Context switches / hour",meeting_ratio:"Meeting density",
notification_rate:"Notifications / hour",focus_ratio:"Focus time",multitasking_index:"Multitasking"};
const MODEL_LABEL={watsonx:"Granite via watsonx",ollama:"Granite via Ollama",heuristic:"Deterministic fallback",deterministic:"Deterministic fallback"};
const ABSENCE_LABEL={vacation:"on vacation",leave:"on leave"};
// Names used by the backend explanation, mapped back to factor keys.
const DRIVER_KEY={"context switches per hour":"context_switches_per_hour","meeting density":"meeting_ratio",
"notification rate":"notification_rate","focus time":"focus_ratio","multitasking":"multitasking_index"};
let PLAN_ID=null; let LAST_SCORE=null; let EVENTS=[]; let CURRENT_PLAN=[]; let WORKERS=[]; let TASKS=[];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function gauge(s){const c=s<50?"#34d399":s<75?"#fbbf24":"#f87171";
return `<div style="width:${Math.max(2,s)}%;background:${c};height:100%;border-radius:8px"></div>`;}
function fmtDate(epoch){return new Date(epoch*1000).toLocaleDateString();}
function spanMinutes(events){if(!events.length)return 240;const t=events.map(e=>e.timestamp);
return Math.max((Math.max(...t)-Math.min(...t))/60,1);}

async function api(url,opts){const r=await fetch(url,opts);if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200));}return r.json();}

function seededRandom(seed){
  let a=seed>>>0;
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function transformEvents(events,scenario){
  if(scenario==="overload") return events;
  const keepN=scenario==="balanced"?0.5:0.15;
  // Deterministic per scenario, so the demo is reproducible like the CLI.
  const rand=seededRandom(scenario==="balanced"?42:7);
  return events.filter(e=>{
    if(e.kind==="meeting"||e.kind==="focus_block") return true;
    return rand()<keepN;
  });
}

function timelineHtml(events){
  if(!events.length) return '<div class="timeline"></div>';
  const times=events.map(e=>e.timestamp);
  const min=Math.min(...times),max=Math.max(...times),span=Math.max(max-min,1);
  const bars=events.map(e=>{
    const left=((e.timestamp-min)/span*100).toFixed(1);
    const w=(e.kind==="meeting"||e.kind==="focus_block")
      ? Math.max(2,Math.min((e.duration_minutes*60/span*100),100)).toFixed(1)
      : 0.3;
    return `<div class="tlbar ${esc(e.kind)}" style="left:${left}%;width:${w}%" title="${esc(e.meta?.source||e.kind)} ${new Date(e.timestamp*1000).toLocaleTimeString()}"></div>`;
  }).join("");
  return `<div class="timeline">${bars}</div>
  <div class="tllegend"><span class="lm">meetings</span><span class="ln">notifications</span><span class="lc">context switches</span><span class="lf">focus blocks</span></div>`;
}

function topDriver(lr){
  // Derived from the backend explanation instead of re-implementing the
  // scoring weights here, so the frontend cannot drift from the engine.
  const m=lr.explanation&&lr.explanation.match(/Main drivers: ([^,]+)/);
  const name=m?m[1].trim():"";
  return DRIVER_KEY[name]||"context_switches_per_hour";
}

function modelChipsHtml(r){
  const proposed=MODEL_LABEL[r.plan.proposed_by]||r.plan.proposed_by||"deterministic";
  const narrator=MODEL_LABEL[r.plan.generated_by]||r.plan.generated_by;
  const guard=r.guardian?.engine||"deterministic";
  const pChip=r.plan.proposed_by&&r.plan.proposed_by!=="deterministic"?"granite":"det";
  const gChip=guard==="granite-guardian"?"ok":"det";
  const roleChip=r.role?`<span class="chip ok">Role: ${esc(r.role)}</span>`:"";
  return `<span class="chip ${pChip}">Decision: ${esc(proposed)}</span>
    <span class="chip ${gChip}">Guardian: ${esc(guard)}</span>
    <span class="chip">Narrator: ${esc(narrator)}</span>
    ${roleChip}
    <span class="chip ${esc(r.plan.status)}">Status: ${esc(r.plan.status)}</span>`;
}

function taskTitle(id){const t=(TASKS||[]).find(t=>t.id===id);return t?(t.title||id):id;}

function itemRowsHtml(items){
  return items.map(i=>{
    const assigneesHtml = (i.suggested_assignees && i.suggested_assignees.length)
      ? `<div style="margin-top:4px"><span class="meta" style="font-size:11px">Suggested teammates:</span> ${i.suggested_assignees.map(a=>`<span class="chip" style="font-size:11px;padding:2px 6px;margin-right:4px">${esc(a)}</span>`).join("")}</div>`
      : "";
    return `<li>
      <span class="badge ${esc(i.action)}">${esc(i.action)}</span>
      <div class="itembody"><b>${esc(i.title)}</b><div class="why">${esc(i.rationale)}</div>${assigneesHtml}</div>
    </li>`;
  }).join("");
}

function alertsHtml(alerts){
  if(!alerts||!alerts.length) return '<div class="meta">No pending reassignments.</div>';
  return `<ul>${alerts.map(a=>`<li>
      <span class="badge reassign">reassign</span>
      <div class="itembody"><b>${esc(a.title)}</b>
        <div class="why">${esc(a.reason)}</div>
        <div class="why">Suggested: ${(a.suggested_assignees||[]).map(esc).join(", ")||"none"} · deadline ${fmtDate(a.deadline)}</div>
      </div>
    </li>`).join("")}</ul>`;
}

function availabilityHtml(workers){
  if(!workers||!workers.length) return '<div class="meta">No team data.</div>';
  const now=Date.now()/1000;
  return `<ul>${workers.map(w=>{
    const cur=(w.absences||[]).find(a=>a.start<=now&&now<=a.end);
    if(cur){
      const label=ABSENCE_LABEL[cur.kind]||cur.kind;
      return `<li><span class="badge absent">absent</span>
        <div class="itembody"><b>${esc(w.name||w.id)}</b>
        <div class="why">${label} · until ${fmtDate(cur.end)}</div></div></li>`;
    }
    return `<li><span class="badge available">available</span>
      <div class="itembody"><b>${esc(w.name||w.id)}</b>
      <div class="why">no scheduled absences</div></div></li>`;
  }).join("")}</ul>`;
}

async function run(){
  document.getElementById("err").textContent="";
  const btn=document.getElementById("runBtn");
  btn.disabled=true;
  const scenario=document.getElementById("scenario").value;
  const role=document.getElementById("role").value || undefined;
  try{
    const s=await api("/sample");
    const events=transformEvents(s.events,scenario);
    EVENTS=events; WORKERS=s.workers||[]; TASKS=s.tasks||[];
    const hist=await api("/history");
    const r=await api("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({events:events,tasks:TASKS,history:hist.history,workers:WORKERS,role:role})});
    render(r);
  }catch(e){
    document.getElementById("err").textContent = e.message==="Failed to fetch"
      ? "⚠ Cannot reach the API — run: pip install -r requirements.txt && python app.py"
      : "⚠ "+e.message;
  }finally{
    btn.disabled=false;
  }
}

async function handleFileUpload(ev){
  const file=ev.target.files&&ev.target.files[0];
  if(!file) return;
  document.getElementById("err").textContent="";
  const btn=document.getElementById("fileInput");
  const uploadBtn=document.querySelector("button[onclick*='fileInput']");
  if(uploadBtn) uploadBtn.disabled=true;
  try{
    const text=await file.text();
    const fmt=file.name.toLowerCase().endsWith(".ics")?"ics":"jsonl";
    const ing=await api("/ingest",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,format:fmt})});
    if(!ing.events.length){
      document.getElementById("err").textContent="⚠ No events found in that file.";
      return;
    }
    EVENTS=ing.events;
    // Use tasks derived from the uploaded calendar when available;
    // only fall back to demo tasks when the ingest response has none.
    if(ing.tasks&&ing.tasks.length){
      TASKS=ing.tasks;
    }else{
      const s=await api("/sample");
      TASKS=s.tasks||[];
    }
    // Workers are not present in uploaded calendars; load from sample.
    const s2=await api("/sample");
    WORKERS=s2.workers||[];
    const hist=await api("/history");
    const role=document.getElementById("role").value || undefined;
    const r=await api("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({events:EVENTS,tasks:TASKS,history:hist.history,workers:WORKERS,role:role})});
    render(r);
  }catch(e){
    document.getElementById("err").textContent = e.message==="Failed to fetch"
      ? "⚠ Cannot reach the API — run: pip install -r requirements.txt && python app.py"
      : "⚠ "+e.message;
  }finally{
    if(uploadBtn) uploadBtn.disabled=false;
  }
  ev.target.value="";
}

function render(r){
  PLAN_ID=r.plan_id; LAST_SCORE=r.load_report.score; CURRENT_PLAN=r.plan.items;
  document.getElementById("saveBaseline").disabled=false;
  document.getElementById("middayBtn").disabled=false;
  document.getElementById("modelChips").innerHTML=modelChipsHtml(r);

  const lr=r.load_report,imp=r.impact;
  const top=topDriver(lr);
  const factorRows=Object.keys(LABELS).map(k=>
    `<tr class="${k===top?'top':''}">${k===top?'<td>★ ':''}<td>${esc(LABELS[k])}</td><td>${lr.factors[k]}</td></tr>`).join("");

  const bm=() => {
    if(!r.baseline) return "";
    const pct=Math.min(Math.max(r.baseline.mean,0),100);
    return `<div class="barmark" style="left:${pct}%"><span class="barmarklabel">baseline ${r.baseline.mean.toFixed(0)}</span></div>`;
  };

  const trendHtml=r.trend?`<div class="trend">${esc(r.trend.summary)}</div>`:"";
  const assumptionsHtml=imp&&imp.assumptions
    ? `<div class="meta" style="margin-top:8px"><b>Assumptions behind the ↓ ${imp.delta} pts projection</b>
        <ul style="margin-top:4px">${Object.entries(imp.assumptions).map(([k,v])=>`<li style="border:0;padding:2px 0"><b>${esc(k)}</b>: ${esc(v)}</li>`).join("")}</ul>
        <div style="color:#6b7280">Projected, not measured — observed impact is only reported when real outcome signals are recorded (see the pilot evaluation).</div></div>`
    : "";
  const whyHtml=`<div class="note">${esc(r.plan.note)}</div>`+
    `<div class="meta" style="margin-top:8px">Top contributor: <b>${esc(LABELS[top])}</b> · ${esc(lr.explanation)}</div>`+
    assumptionsHtml;

  const itemRows=r.plan.items.map((i,idx)=>{
    const assigneesHtml = (i.suggested_assignees && i.suggested_assignees.length)
      ? `<div style="margin-top:4px"><span class="meta" style="font-size:11px">Suggested teammates:</span> ${i.suggested_assignees.map(a=>`<span class="chip" style="font-size:11px;padding:2px 6px;margin-right:4px">${esc(a)}</span>`).join("")}</div>`
      : "";
    return `<li>
      <input type="checkbox" class="editcb hidden" data-idx="${idx}" checked>
      ${i.task_id?`<label title="Mark completed" style="cursor:pointer;margin-right:6px"><input type="checkbox" class="completedcb" data-task-id="${esc(i.task_id)}"> ✓</label>`:''}
      <span class="badge ${esc(i.action)}">${esc(i.action)}</span>
      <div class="itembody"><b>${esc(i.title)}</b><div class="why">${esc(i.rationale)}</div>${assigneesHtml}</div>
    </li>`;
  }).join("");

  const status=esc(r.plan.status);
  const alerts=(r.reassignment_alerts||[]);
  const aiChip=(lr.ai_interruption_ratio!=null&&lr.factors&&lr.factors.notification_rate>0)
    ? `<div class="chip" style="margin-top:8px">🤖 AI interruptions: ${Math.round(lr.ai_interruption_ratio*100)}% of notifications</div>`
    : "";
  const summary=`<div class="summaryline" id="summaryLine">Load <b>${esc(lr.level)}</b> · ${imp.before_score.toFixed(0)}/100 →
    <b>${imp.after_score.toFixed(0)}</b> after plan (↓ ${imp.delta} pts) ·
    ${r.plan.items.length} actions · ${alerts.length} pending reassignment(s)</div>${aiChip}`;

  // The six-step loop, reflecting the actual state of this run.
  const proposed=MODEL_LABEL[r.plan.proposed_by]||r.plan.proposed_by||"deterministic";
  const guardName=r.guardian?.engine||"deterministic";
  const guardOk=r.guardian?(r.guardian.passed?" ✓ passed":" ✗ blocked"):"";
  const loop=`<div class="card" style="margin-top:20px">
      <h2>🧠 How LoadGuard protects your attention</h2>
      <div class="note" style="margin-bottom:12px">Every AI assistant adds notifications, context switches, and micro-decisions.
        LoadGuard is the co-worker whose job is to <b>protect your attention budget</b>: it senses when interruptions pile up,
        explains why, proposes a calmer day — and only acts with your approval.</div>
      <div class="grid" style="margin-top:0">
        <div><div class="meta">1 · Sense</div><div class="summaryline" style="margin:0">${EVENTS.length} signal(s) read</div></div>
        <div><div class="meta">2 · Diagnose</div><div class="summaryline" style="margin:0">Load <b>${esc(lr.level)}</b> · ${lr.score.toFixed(0)}/100</div></div>
        <div><div class="meta">3 · Propose</div><div class="summaryline" style="margin:0">${esc(proposed)}</div></div>
        <div><div class="meta">4 · Validate</div><div class="summaryline" style="margin:0">${esc(guardName)}${guardOk}</div></div>
        <div><div class="meta">5 · You decide</div><div class="summaryline" style="margin:0">${esc(r.plan.status)}</div></div>
        <div><div class="meta">6 · Act &amp; measure</div><div class="summaryline" style="margin:0">↓ ${imp.delta} pts projected</div></div>
      </div>
    </div>`;

  // What Granite proposed before the deterministic gate (only when an LLM is
  // configured and its proposal passed validation).
  const prop=r.proposal;
  const proposalHtml=(prop&&(prop.priority_task_id||(prop.delegate_task_ids&&prop.delegate_task_ids.length)||(prop.inserts&&prop.inserts.length)||prop.rationale))
    ? `<details class="section"><summary>🤖 What Granite proposed (before the gate)</summary>
        <div class="meta">${esc(prop.rationale||"")}</div>
        <ul style="margin-top:8px">
          ${prop.priority_task_id?`<li><span class="badge do">prioritize</span><div class="itembody"><b>${esc(taskTitle(prop.priority_task_id))}</b></div></li>`:""}
          ${(prop.delegate_task_ids||[]).map(id=>`<li><span class="badge delegate">delegate</span><div class="itembody"><b>${esc(taskTitle(id))}</b></div></li>`).join("")}
          ${(prop.inserts||[]).map(ins=>`<li><span class="badge ${esc(ins.action)}">${esc(ins.action)}</span><div class="itembody"><b>after ${esc(ins.after_task_id?taskTitle(ins.after_task_id):"the day")}</b></div></li>`).join("")}
        </ul>
        <div class="meta">Validated by the deterministic gate before it reached your plan.</div>
      </details>`
    : "";

  document.getElementById("out").innerHTML=`
    ${loop}
    <div class="card" style="margin-top:20px">
      <h2>At a glance</h2>${summary}
      <div class="grid" style="margin-top:16px">
        <div><div class="meta">Before</div><div class="big">${imp.before_score.toFixed(0)}<span style="font-size:20px">/100</span></div>
          <div class="level">${esc(imp.before_level)}</div>
          <div class="bar">${gauge(imp.before_score)}${r.baseline?bm():""}</div>${trendHtml}</div>
        <div><div class="meta">After following the plan</div><div class="big" id="afterScore">${imp.after_score.toFixed(0)}<span style="font-size:20px">/100</span></div>
          <div class="level" id="afterLevel">${esc(imp.after_level)}</div>
          <div class="bar" id="afterBar">${gauge(imp.after_score)}</div>
          <div class="delta" id="deltaLine">↓ ${imp.delta} points projected</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:20px"><h2>Proposed plan</h2><ul>${itemRows}</ul>
      <div class="actions">
        <button class="green" onclick="decide('accepted')" ${status!=="pending"?"disabled":""}>Accept plan</button>
        <button class="ghost" onclick="toggleEdit()" ${status!=="pending"?"disabled":""} id="editBtn">Edit plan</button>
        <button class="red" onclick="decide('rejected')" ${status!=="pending"?"disabled":""}>Reject</button>
        <button class="ghost hidden" id="saveEdit" onclick="saveEdit()">Save edited plan</button>
      </div>
      <div id="statusLine" class="meta" style="margin-top:10px"></div>
      <div class="exportlinks hidden" id="exports">
        <a href="/plan/${esc(PLAN_ID)}/export.ics" download>📅 Export calendar (.ics)</a>
        <a href="/plan/${esc(PLAN_ID)}/export.csv" download>📋 Export tasks (.csv)</a>
      </div>
      <div class="feedback hidden" id="feedback">
        <div class="meta">Was this recommendation helpful?</div>
        <button class="ghost" onclick="feedback('yes')">👍 Yes</button>
        <button class="ghost" onclick="feedback('no')">👎 No</button>
        <input id="fbNote" type="text" placeholder="optional note" style="background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px;color:#e5e7eb;margin-top:8px;width:100%;box-sizing:border-box">
      </div>
    </div>

    <div class="card" style="margin-top:20px"><h2>⚠ Pending reassignments</h2>${alertsHtml(alerts)}</div>

    <div class="card" style="margin-top:20px"><h2>Team — availability</h2>${availabilityHtml(WORKERS)}</div>

    <details class="section"><summary>🕒 Signal timeline</summary>${timelineHtml(EVENTS)}</details>
    <details class="section"><summary>📊 Signals (proxies)</summary><table>${factorRows}</table></details>
    ${proposalHtml}
    <details class="section"><summary>💡 Why am I seeing this recommendation?</summary>${whyHtml}</details>
    <details class="section"><summary>🔒 Privacy</summary>
      <div class="privacy" id="privacyBox">loading…</div>
      <div class="meta" style="margin-top:8px">Signals are processed locally · your history lives in <code>.loadguard/</code> on this machine · consent is implicit by running it, and everything is deletable anytime.</div>
      <div class="actions"><button class="red" onclick="deleteHistory()">Delete my history</button></div>
    </details>
    <details class="section"><summary>🔬 Pilot evaluation (Baseline vs. Projected vs. Observed)</summary>
      <div class="meta">Three-phase measurement: the day without LoadGuard, the plan it proposes, and real outcome signals recorded after following it. Observed is only shown when real outcome signals are supplied — never fabricated.</div>
      <div id="pilotBox" class="meta" style="margin-top:10px"></div>
      <div class="actions"><button class="ghost" onclick="pilotRun()">Run pilot evaluation</button></div>
    </details>

    <div class="disc" id="disclaimer">${esc(lr.disclaimer)}</div>`;
  updateStatusLine(status);
  fetchPrivacy();
}

function updateStatusLine(status){
  const el=document.getElementById("statusLine");
  const exports=document.getElementById("exports");
  const feedback=document.getElementById("feedback");
  if(!el) return;
  if(status==="accepted"){
    el.innerHTML="✅ Plan accepted — protected blocks exported to your calendar. LoadGuard is acting on your day.";
    exports.classList.remove("hidden"); feedback.classList.remove("hidden");
  }else if(status==="rejected"){
    el.innerHTML="❌ Plan rejected — no changes applied. Your day stays exactly as it was.";
    feedback.classList.remove("hidden");
  }else if(status==="edited"){
    el.innerHTML="✏️ Edited plan saved — LoadGuard applies only what you kept.";
    exports.classList.remove("hidden"); feedback.classList.remove("hidden");
  }else{
    el.innerHTML="Plan is a suggestion. Granite proposes, LoadGuard validates, you decide.";
  }
}

function toggleEdit(){
  document.querySelectorAll(".editcb").forEach(c=>c.classList.remove("hidden"));
  document.getElementById("saveEdit").classList.remove("hidden");
  document.getElementById("editBtn").textContent="Cancel edit";
  document.getElementById("editBtn").onclick=()=>{
    document.querySelectorAll(".editcb").forEach(c=>c.classList.add("hidden"));
    document.getElementById("saveEdit").classList.add("hidden");
    document.getElementById("editBtn").textContent="Edit plan";
    document.getElementById("editBtn").onclick=toggleEdit;
  };
}

async function saveEdit(){
  const boxes=document.querySelectorAll(".editcb");
  const kept=[],removed=[];
  boxes.forEach((box,idx)=>{
    if(box.checked) kept.push(CURRENT_PLAN[idx]);
    else removed.push(CURRENT_PLAN[idx].title||"item "+(idx+1));
  });
  if(!kept.length){
    document.getElementById("err").textContent="⚠ Keep at least one plan item — an empty plan cannot be applied.";
    return;
  }
  try{
    const r=await api("/approve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({plan_id:PLAN_ID,decision:"edited",items:kept,feedback:"removed: "+removed.join(", ")})});
    document.querySelectorAll(".actions button").forEach(b=>b.disabled=true);
    updateStatusLine(r.status);
    if(r.impact){
      const imp=r.impact;
      const byId=(id)=>document.getElementById(id);
      if(byId("afterScore")) byId("afterScore").innerHTML=imp.after_score.toFixed(0)+'<span style="font-size:20px">/100</span>';
      if(byId("afterLevel")) byId("afterLevel").textContent=imp.after_level;
      if(byId("afterBar")) byId("afterBar").innerHTML=gauge(imp.after_score);
      if(byId("deltaLine")) byId("deltaLine").textContent="↓ "+imp.delta+" points projected (customized plan)";
      if(byId("summaryLine")) byId("summaryLine").innerHTML=`Load <b>${esc(imp.after_level)}</b> · ${imp.before_score.toFixed(0)}/100 → <b>${imp.after_score.toFixed(0)}</b> after plan (↓ ${imp.delta} pts) · customized edit`;
    }
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function decide(decision){
  try{
    const body={plan_id:PLAN_ID,decision};
    const r=await api("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    document.querySelectorAll(".actions button").forEach(b=>b.disabled=true);
    updateStatusLine(r.status);
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function middayReview(){
  document.getElementById("err").textContent="";
  const box=document.getElementById("middayBox");
  try{
    const completedTasks = Array.from(document.querySelectorAll(".completedcb:checked"))
      .map(cb => cb.dataset.taskId)
      .filter(Boolean);
    const elapsed=spanMinutes(EVENTS);
    const role=document.getElementById("role").value || undefined;
    const r=await api("/midday",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({events:EVENTS,tasks:TASKS,workers:WORKERS,elapsed_minutes:elapsed,total_minutes:480,completed_task_ids:completedTasks,role:role})});
    const planHtml=(r.reorganized&&r.plan&&r.plan.items&&r.plan.items.length)
      ? `<h2 style="margin-top:14px">Reorganized plan</h2><ul>${itemRowsHtml(r.plan.items)}</ul>
         <div class="actions" id="middayActions">
           <button class="green" onclick="decideMidday('accepted','${esc(r.plan.plan_id)}')">Accept afternoon plan</button>
           <button class="red" onclick="decideMidday('rejected','${esc(r.plan.plan_id)}')">Reject afternoon plan</button>
           <span class="exportlinks">
             <a href="/plan/${esc(r.plan.plan_id)}/export.ics" download>📅 Export afternoon (.ics)</a>
             <a href="/plan/${esc(r.plan.plan_id)}/export.csv" download>📋 Export afternoon (.csv)</a>
           </span>
         </div>
         <div class="meta" id="middayStatus"></div>` : "";
    box.innerHTML=`
      <div class="card" style="margin-top:20px">
        <h2>🕛 Midday review</h2>
        <div class="grid" style="margin-top:0">
          <div><div class="meta">Observed now</div><div class="big">${r.observed_score.toFixed(0)}<span style="font-size:20px">/100</span></div><div class="level">${esc(r.observed_level)}</div></div>
          <div><div class="meta">Projected end of day</div><div class="big">${r.projected_score.toFixed(0)}<span style="font-size:20px">/100</span></div><div class="level">${esc(r.projected_level)}</div></div>
        </div>
        <div class="meta" style="margin-top:10px">${esc(r.rationale)} · ${r.remaining_minutes.toFixed(0)} min remaining</div>
        ${planHtml}
        <h2 style="margin-top:14px">Reassignments</h2>${alertsHtml(r.reassignment_alerts)}
      </div>`;
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function decideMidday(decision,planId){
  try{
    const r=await api("/approve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({plan_id:planId,decision})});
    const el=document.getElementById("middayStatus");
    if(el){
      el.innerHTML = decision==="accepted"
        ? "✅ Afternoon plan accepted — protected blocks exported to your calendar."
        : "❌ Afternoon plan rejected — your afternoon stays as it is.";
    }
    const btns=document.getElementById("middayActions");
    if(btns) btns.querySelectorAll("button").forEach(b=>b.disabled=true);
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function feedback(helpful){
  try{
    const note=document.getElementById("fbNote")?.value||"";
    await api("/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({plan_id:PLAN_ID,helpful,feedback:note})});
    document.getElementById("feedback").innerHTML='<div class="meta">Thanks — your feedback is recorded in the local audit trail.</div>';
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function pilotRun(){
  document.getElementById("err").textContent="";
  const box=document.getElementById("pilotBox");
  if(!box) return;
  try{
    const r=await api("/pilot");
    const col=(label,pm)=>`<div><div class="meta">${label}</div><div class="big" style="font-size:32px">${pm.score.toFixed(0)}</div><div class="level">${esc(pm.level)}</div></div>`;
    const obs=r.observed
      ? col("Observed", r.observed)
      : `<div><div class="meta">Observed</div><div class="big" style="font-size:32px">—</div><div class="meta">needs real outcome signals</div></div>`;
    box.innerHTML=`<div class="grid" style="margin-top:0;grid-template-columns:1fr 1fr 1fr">${col("Baseline", r.baseline)}${col("Projected", r.projected)}${obs}</div>
      <div class="summaryline" style="margin-top:10px">${esc(r.summary)}</div>`;
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function fetchPrivacy(){
  try{
    const p=await api("/privacy");
    document.getElementById("privacyBox").innerHTML=
      `<b>Captured</b> (counts only): ${p.captured.map(esc).join(" · ")}<br><br>`+
      `<b>Never captured</b>: ${p.never_captured.map(esc).join(" · ")}<br><br>`+
      `<b>Local-first</b>: ${p.local_first?"all signals stay on your machine":""}<br><br>`+
      esc(p.statement);
  }catch(e){document.getElementById("privacyBox").textContent="unavailable";}
}

async function saveToBaseline(){
  if(LAST_SCORE==null) return;
  try{
    await api("/history",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({score:LAST_SCORE})});
    const box=document.getElementById("historyBox");
    if(box){
      box.innerHTML='<div style="color:#34d399">✅ Saved today\'s score ('+LAST_SCORE.toFixed(0)+'/100) to your personal baseline.</div>';
      box.classList.remove("hidden");
    }
    document.getElementById("err").textContent="";
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function loadHistory(){
  try{
    const h=await api("/history");
    const html=h.history.length
      ? `<div><b>Personal baseline history:</b> ${h.history.map(s=>s.toFixed(0)).join(" → ")} (${h.history.length} score(s))</div>`
      : `<div>No history yet — click "Save today's score to baseline" after running an analysis.</div>`;
    const box=document.getElementById("historyBox");
    if(box) {
      box.innerHTML=html;
      box.classList.remove("hidden");
    }
    document.getElementById("err").textContent="";
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

async function deleteHistory(){
  try{
    await api("/history",{method:"DELETE"});
    document.getElementById("err").textContent="";
    document.getElementById("historyBox").innerHTML='<div style="color:#34d399">✅ History deleted.</div>';
    document.getElementById("historyBox").classList.remove("hidden");
  }catch(e){document.getElementById("err").textContent="⚠ "+e.message;}
}

run();
</script>
</body>
</html>
